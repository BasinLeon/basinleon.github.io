name: Validate Analytics Worker

on:
  push:
    branches: ["main"]
    paths:
      - "analytics-worker/**"
      - ".github/workflows/validate-analytics-worker.yml"
  pull_request:
    paths:
      - "analytics-worker/**"
      - ".github/workflows/validate-analytics-worker.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
